name: Test Numerai CLI

# Publishing lives in pypi.yml and is triggered by version tags, not by pushes
# to this or any other branch. See RELEASING.md.
on:
  workflow_dispatch:
  push:

concurrency: test-numerai-cli-${{ github.ref }}

jobs:
  build-python:
    name: Build Python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: python -m unittest discover -s tests
      - run: numerai copy-example
      - run: test -e tournament-python3/predict.py

  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd numerai/examples/tournament-python3 \
          && docker build -t example-python \
            --build-arg NUMERAI_PUBLIC_ID=test \
            --build-arg NUMERAI_SECRET_KEY=test .
