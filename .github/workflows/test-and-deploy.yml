name: Test & Deploy Numerai CLI

on:
  workflow_dispatch:
  push:

concurrency: deploy-numerai-cli-${{ github.ref }}

jobs:
  build-python:
    name: Build Python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: numerai copy-example
      - run: test -e tournament-python3/predict.py

  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: |
          cd numerai/examples/tournament-python3 \
          && docker build -t example-python \
            --build-arg NUMERAI_PUBLIC_ID=test \
            --build-arg NUMERAI_SECRET_KEY=test .

  pypi-release:
    name: PyPI Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [build-python, build-docker]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade setuptools twine wheel
      - run: python setup.py sdist bdist_wheel
      - run: |
          python -m twine upload \
            -u __token__ \
            -p ${{ secrets.PYPI_API_KEY }} \
            --skip-existing dist/*
